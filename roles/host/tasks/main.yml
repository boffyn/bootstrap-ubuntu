---
- name: host | Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname_short }}"

- name: host | Ensure /etc/hosts resolves the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ hostname_full }} {{ hostname_short }}"
    # On for testing in a container (due to /etc/hosts being mounted)
    # Off for production
    unsafe_writes: "{{ unsafe_writes }}"
