---
- name: packages | Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist

- name: packages | Install base tools
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - git
      - python3
      - acl
      - ack
      - iftop
      - net-tools
      - vim
      # boffyn[host]'s dependency chain (duplicity -> pyrax -> ... ->
      # netifaces) needs to compile a C extension from source - netifaces'
      # last prebuilt wheel targets Python 3.9, so any modern Python build
      # needs a real compiler. Confirmed: build-essential alone is enough,
      # uv's managed Python builds already bundle their own headers.
      - build-essential
    state: present

- name: packages | Install fuse-overlayfs
  ansible.builtin.apt:
    name: fuse-overlayfs
    state: present

- name: packages | Get current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: packages__current_tz
  changed_when: false

- name: packages | Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ tz_value }}"
  when: packages__current_tz.stdout != tz_value

- name: packages | Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: packages | Configure unattended-upgrades
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/apt/apt.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 10periodic
    - 50unattended-upgrades

- name: packages | Check for an existing uv install
  ansible.builtin.command: uv --version
  register: packages__uv_version
  changed_when: false
  failed_when: false

- name: packages | Install uv {{ uv_version }}
  ansible.builtin.shell:
    cmd: "curl -LsSf https://astral.sh/uv/{{ uv_version }}/install.sh | sh"
  environment:
    UV_INSTALL_DIR: /usr/local/bin
    INSTALLER_NO_MODIFY_PATH: "1"
  when: >
    packages__uv_version.rc != 0
    or (packages__uv_version.stdout.split() | length < 2)
    or packages__uv_version.stdout.split()[1] != uv_version
